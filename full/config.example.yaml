# VT-Spec Configuration Example
# Copy to .vtspec/config.yaml and customize

version: "0.1"

project:
  name: MyProject
  description: Project description
  stack: TypeScript/Node.js  # or Python/Django, Go, Rust, etc.
  conventions: []

security:
  posture: standard  # standard | elevated | paranoid
  # standard: STRIDE light — top risks, risk levels, one-line mitigations
  # elevated: Full STRIDE + OWASP Top 10 mapping, threat scenarios with attacker goals
  # paranoid: STRIDE + OWASP + DREAD scoring (1-10), prioritized mitigation plan

memory:
  backend: auto  # auto | alejandria | engram | local
  # auto: tries Alejandría first, degrades to local if unavailable (recommended)
  # alejandria: requires Alejandría MCP server (fails if not available)
  # engram: for AI agents with Engram tool support (no Node.js access)
  # local: no memory backend (proposals/findings isolated per session)
  
  # alejandria_cmd: "npx @alejandria/server"  # Required for alejandria/auto backends

# Per-phase model routing (optional, v2.4 — Gentle-AI inspired)
# Hint which model to use for each VT-Spec phase. The agent reads this hint
# and selects the appropriate model if supported by the platform.
# models:
#   propose: claude-opus-4
#   spec: claude-sonnet-4-5
#   review: claude-opus-4          # Use most capable model for security review
#   tasks: claude-sonnet-4-5
#   apply: claude-sonnet-4-5
#   audit: claude-opus-4           # Use most capable model for auditing
#   design: claude-opus-4
#   explore: claude-haiku-3-5      # Use fast model for codebase exploration

# Exploration settings (optional - runs before propose to investigate codebase)
explore:
  mode: auto  # auto | always | never | prompt
  # auto: triggers on security keywords (auth, payment, api, etc.)
  # always: always explore before propose
  # never: skip exploration
  # prompt: ask user each time
  
  max_tokens: 50000  # budget for exploration (optional, default: 50000)
  
  # Override auto-detection (optional)
  # force_explore: true  # always explore regardless of keywords
  # skip_explore: true   # never explore regardless of keywords

# VeriScan integration (optional — fail-silent, zero impact on dev workflow)
#
# When configured, vtspec sends a silent signal to your VeriScan instance
# after each vt-review and vt-audit phase. VeriScan uses this to build a
# security funnel correlating spec-time findings with MR findings and
# production merges. If unreachable, nothing happens.
#
# veriscan:
#   webhook_url: https://veriscan.veritran.cloud  # no trailing slash

# Standalone LLM integration (optional — only needed for terminal use WITHOUT a coding agent)
#
# When running vtspec inside Copilot CLI or Claude Code, the agent itself IS the LLM.
# No API key needed — the agent reads prompts and processes them directly.
#
# When running from a plain terminal (no coding agent), set one of these env vars:
#   ANTHROPIC_API_KEY=sk-ant-...    → uses claude-sonnet-4 by default
#   OPENAI_API_KEY=sk-...           → uses gpt-4o by default
#
# Or configure here for per-command model overrides:
# cli:
#   llm:
#     provider: anthropic           # anthropic | openai
#     api_key_env: ANTHROPIC_API_KEY
#     model: claude-opus-4          # override default model for scan/debate/review

